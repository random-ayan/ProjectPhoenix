<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Portal - Project Phoenix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #0f172a; color: #fff; font-family: Arial, sans-serif; text-align: center; padding-top: 100px;">

    <!-- Password Protection Box -->
    <div id="auth-box">
        <h2>🔒 Restricted Area</h2>
        <p>Please enter the password to view this section:</p>
        <input type="password" id="page-password" placeholder="Enter password" style="padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; width: 250px;">
        <br><br>
        <button onclick="verifyPassword()" style="padding: 10px 20px; font-size: 16px; background-color: #3b82f6; color: white; border: none; border-radius: 5px; cursor: pointer;">Access</button>
        <p id="error-msg" style="color: #ef4444; margin-top: 15px;"></p>
    </div>

    <!-- Content that will be hidden before using password -->
    <div id="protected-content" style="display: none;">
        <h1>Welcome to the Private Gallery 🌟</h1>
        <p>Private Photos</p>
        <!-- Secret Code -->
    </div>

    <script>
        function verifyPassword() {
            let pass = document.getElementById("page-password").value;
            
            // Password
            if (pass === "rocky loves piu") { 
                document.getElementById("auth-box").style.display = "none";
                document.getElementById("protected-content").style.display = "block";
            } else {
                document.getElementById("error-msg").innerText = "Incorrect Password! Try again.";
            }
        }
    </script>

</body>
</html>
