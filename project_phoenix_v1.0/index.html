    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project Phoenix - Under Maintenance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- তোমার ওয়েবসাইটের টাইমার বা অন্যান্য ডিজাইন এখানে থাকবে -->
    <div class="countdown">
        <span id="days">00</span> Days
    </div>

    <!-- HTML ফাইলের একদম শেষ পর্যায়ে (</body> ট্যাগের ঠিক ওপরে) এই স্ক্রিপ্টটি বসাতে হবে -->
    <script>
        document.addEventListener('contextmenu', function(e) {
            if (e.target.nodeName === 'IMG') {
                e.preventDefault();
                alert('Any image on this page is protected by copyright. Please do not download or use it without permission.');
            }
        });

        const targetDate = new Date("December 31, 2026 23:59:59").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const timeLeft = targetDate - now;

            if (timeLeft < 0) {
                if (document.getElementById("days")) document.getElementById("days").innerText = "00";
                return;
            }

            const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

            if (document.getElementById("days")) document.getElementById("days").innerText = String(days).padStart(2, '0');
            if (document.getElementById("hours")) document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            if (document.getElementById("minutes")) document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            if (document.getElementById("seconds")) document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
